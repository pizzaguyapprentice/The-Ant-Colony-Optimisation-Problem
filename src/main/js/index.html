<html>
    <head>
        <meta charset="UTF-8">
        <link rel = "stylesheet">
        <title>D3 Node Graph</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
            }
            .controls {
                margin: 20px;
                padding: 15px;
                background-color: #f0f0f0;
                border-radius: 5px;
                flex-shrink: 0;
            }
            .control-group {
                margin-bottom: 10px;
            }
            label {
                font-weight: bold;
                margin-right: 10px;
            }
            input, select, button {
                padding: 8px;
                margin-right: 10px;
                border: 1px solid #ccc;
                border-radius: 3px;
            }
            button {
                background-color: #4CAF50;
                color: white;
                cursor: pointer;
            }
            button:hover {
                background-color: #45a049;
            }
            .arrow-button {
                background-color: #2196F3;
                padding: 10px 15px;
                font-size: 18px;
                margin: 0 5px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                min-width: 45px;
            }
            .arrow-button:hover {
                background-color: #0b7dda;
            }
            .navigation-group {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            #iterationInfo {
                margin-top: 10px;
                font-weight: bold;
                color: #333;
            }
            .svg-container {
                flex: 1;
                overflow: auto;
                margin: 20px;
                border: 1px solid #ddd;
                border-radius: 5px;
                background-color: #222;
            }
            #debug-panel {
                position: fixed;
                bottom: 10px;
                right: 10px;
                background-color: rgba(0, 0, 0, 0.9);
                color: #0f0;
                padding: 10px;
                border: 2px solid #0f0;
                border-radius: 5px;
                font-family: monospace;
                font-size: 11px;
                max-width: 300px;
                max-height: 150px;
                overflow-y: auto;
                z-index: 9999;
            }
            svg {
                width: 100%;
                height: 100%;
                display: block;
            }
        </style>
    </head>

    <body>
        <h1>ACO Graph Node </h1>
        
        
        <div class="controls">
            <div class="control-group">
                <label>Output File:</label>
                <select id="fileSelect" onchange="selectOutputFile()">
                    <option value="">Loading files...</option>
                </select>
                <small id="fileInfo"></small>
            </div>
            
            <div class="control-group">
                <label>Search Iteration:</label>
                <input type="number" id="iterationSearch" placeholder="Enter iteration number" min="1">
                <button onclick="searchIteration()">Go to Iteration</button>
            </div>
            
            <div class="control-group navigation-group">
                <button class="arrow-button" onclick="previousIteration()">← Previous</button>
                <span id="iterationInfo"></span>
                <button class="arrow-button" onclick="nextIteration()">Next →</button>
            </div>
        </div>

        <div class="svg-container">
            <svg preserveAspectRatio="xMidYMid meet" viewBox="0 0 1500 1500"></svg>
        </div>
        <script src="index.js"></script>
    </body>
</html>
